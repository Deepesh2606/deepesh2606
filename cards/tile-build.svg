<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 174" width="272" height="174">
  <defs>
    <linearGradient id="tileSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="2 0" begin="2.8s" dur="4.2s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <style>

    @keyframes tileSwing {
      0%   { opacity: 0; transform: translateY(22px) rotate(-1.6deg); }
      70%  { opacity: 1; transform: translateY(-3px) rotate(0.4deg); }
      100% { opacity: 1; transform: translateY(0) rotate(0deg); }
    }
    @keyframes ringPulse {
      0%   { opacity: 0.45; transform: scale(0.7); }
      100% { opacity: 0; transform: scale(2.1); }
    }
    @keyframes arrowNudge {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(3px, -3px); }
    }
    .tile-wrap {
      transform-box: fill-box;
      transform-origin: center bottom;
      opacity: 0;
      animation: tileSwing 0.65s cubic-bezier(.2,.85,.25,1) 1.75s forwards;
    }
    .ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: ringPulse 2.8s ease-out 2.25s infinite;
    }
    .arrow {
      transform-box: fill-box;
      transform-origin: center;
      animation: arrowNudge 2.2s ease-in-out 2.55s infinite;
    }
    

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
    </style>
  <g class="tile-wrap">
    <rect x="0.5" y="0.5" width="271" height="173" rx="14" fill="#1D4ED8" stroke="#1D4ED8" />
    <rect x="0.5" y="0.5" width="271" height="173" rx="14" fill="url(#tileSheen)" />

    <circle cx="244" cy="28" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.5" class="ring" />
    <text x="244" y="33" text-anchor="middle" fill="#FFFFFF" font-family="'DuoMono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" class="arrow">↗</text>

