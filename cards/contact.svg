<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 130" width="840" height="130">
  <style>

    @keyframes bannerFade {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .banner-wrap {
      opacity: 0;
      animation: bannerFade 0.6s cubic-bezier(.2,.8,.2,1) 2.6s forwards;
    }
    

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
    </style>
  <g class="banner-wrap">
    <rect x="0.5" y="0.5" width="839" height="129" rx="14" fill="#FFFFFF" stroke="#DFDFD8" />

    <!-- Left side: pitch -->
    <text x="32" y="34" fill="#1D4ED8" font-family="'DuoMono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1">
      GOT A STORE OR IDEA IN MIND?
    </text>
    <text x="32" y="66" fill="#121316" font-family="'DuoDisplay', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700">
      Let's build yours.
    </text>
    <text x="32" y="94" fill="#5C606E" font-family="'DuoSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
      From first sketch to a store taking orders — one person, start to finish.
    </text>

    <!-- Right side: Contact action badges -->
    <!-- WhatsApp -->
    <rect x="520" y="22" width="288" height="28" rx="7" fill="#F8F8F6" stroke="#DFDFD8" />
    <text x="532" y="40" fill="#121316" font-family="'DuoMono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600">
      💬 WhatsApp: +91 88474 43583 ↗
    </text>

    <!-- Email -->
    <rect x="520" y="55" width="288" height="28" rx="7" fill="#F8F8F6" stroke="#DFDFD8" />
    <text x="532" y="73" fill="#121316" font-family="'DuoMono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600">
      ✉️ deepeshsingh2606@gmail.com ↗
    </text>

    <!-- Portfolio -->
    <rect x="520" y="88" width="288" height="28" rx="7" fill="#DBEAFE" stroke="#1D4ED8" stroke-opacity="0.3" />
    <text x="532" y="106" fill="#1D4ED8" font-family="'DuoMono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700">
      🌐 portfolio-deepesh.lovable.app ↗
    </text>
  </g>
</svg>