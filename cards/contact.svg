<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 120" width="840" height="120">
  <style>

    @keyframes bannerFade {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .banner-wrap {
      opacity: 0;
      animation: bannerFade 0.6s cubic-bezier(.2,.8,.2,1) 2.6s forwards;
    }
    

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
    </style>
  <g class="banner-wrap">
    <rect x="0.5" y="0.5" width="839" height="119" rx="14" fill="#FFFFFF" stroke="#DFDFD8" />

    <!-- Left side: pitch -->
    <text x="32" y="32" fill="#1D4ED8" font-family="'DuoMono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1">
      GOT A STORE OR IDEA IN MIND?
    </text>
    <text x="32" y="62" fill="#121316" font-family="'DuoDisplay', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700">
      Let's build yours.
    </text>
    <text x="32" y="88" fill="#5C606E" font-family="'DuoSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
      From first sketch to a store taking orders — one person, start to finish.
    </text>

    <!-- Right side: Contact action badges -->
    <!-- Email (Primary CTA) -->
    <rect x="520" y="24" width="288" height="34" rx="8" fill="#1D4ED8" />
    <text x="664" y="46" text-anchor="middle" fill="#FFFFFF" font-family="'DuoMono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">
      ✉️ deepeshsingh2606@gmail.com ↗
    </text>

    <!-- Portfolio -->
    <rect x="520" y="66" width="288" height="34" rx="8" fill="#FFFFFF" stroke="#DFDFD8" />
    <text x="664" y="88" text-anchor="middle" fill="#1D4ED8" font-family="'DuoMono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">
      🌐 portfolio-deepesh.lovable.app ↗
    </text>
  </g>
</svg>