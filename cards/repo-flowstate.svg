<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 166" width="412" height="166">
  <style>

    @keyframes repoRise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .repo-wrap {
      opacity: 0;
      animation: repoRise 0.55s cubic-bezier(.2,.8,.2,1) 2.35s forwards;
    }
    

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
    </style>
  <g class="repo-wrap">
    <rect x="0.5" y="0.5" width="411" height="165" rx="14" fill="#F8F8F6" stroke="#DFDFD8" />
    <rect x="22" y="20" width="96" height="22" rx="6" fill="#DBEAFE" />
    <text x="70" y="34" text-anchor="middle" fill="#1D4ED8" font-family="'DuoMono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700">
      FEATURED REPO
    </text>
    <text x="388" y="36" text-anchor="end" fill="#1D4ED8" font-family="'DuoMono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700">↗</text>

    <text x="22" y="72" fill="#121316" font-family="'DuoDisplay', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700">
      FLOWSTATE
    </text>
    <text x="22" y="96" fill="#5C606E" font-family="'DuoSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">
      Distraction-free Pomodoro focus timer &amp; productivity workspace.
    </text>
    <rect x="22" y="122" width="68.4" height="24" rx="6" fill="#FFFFFF" stroke="#DFDFD8" /><text x="56.2" y="138" text-anchor="middle" fill="#121316" font-family="'DuoMono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">Web App</text><rect x="98.4" y="122" width="75.6" height="24" rx="6" fill="#FFFFFF" stroke="#DFDFD8" /><text x="136.2" y="138" text-anchor="middle" fill="#121316" font-family="'DuoMono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">Pomodoro</text><rect x="182.0" y="122" width="54.0" height="24" rx="6" fill="#FFFFFF" stroke="#DFDFD8" /><text x="209.0" y="138" text-anchor="middle" fill="#121316" font-family="'DuoMono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">UI/UX</text>
  </g>
</svg>